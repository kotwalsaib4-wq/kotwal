<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د زنګ لاین — کارن پاڼه</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0d1210;
    --panel:#141b18;
    --line:#233029;
    --text:#e8efe9;
    --dim:#7f9188;
    --accent:#4fd1a5;
    --ring:#e6b95c;
    --danger:#e0665a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .box{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px;
  }
  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .status-row .num{
    font-size:13px;
    color:var(--dim);
    letter-spacing:.02em;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;
    background:var(--dim);
    margin-inline-end:6px;
  }
  .dot.live{background:var(--accent);}
  .idle-msg{
    color:var(--dim);
    font-size:14px;
    line-height:1.9;
    text-align:center;
    padding:30px 0;
  }
  .ring-msg{
    display:none;
    text-align:center;
  }
  .ring-msg.show{display:block;}
  .ring-msg .who{
    font-size:15px;
    color:var(--ring);
    margin-bottom:18px;
  }
  .btn-row{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  button{
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    padding:12px 22px;
    border-radius:4px;
    cursor:pointer;
  }
  button.accept{border-color:var(--accent); color:var(--accent);}
  button.accept:hover{background:rgba(79,209,165,.1);}
  button.decline{border-color:var(--danger); color:var(--danger);}
  button.decline:hover{background:rgba(224,102,90,.1);}
  .call-panel{
    display:none;
    text-align:center;
  }
  .call-panel.show{display:block;}
  .timer{
    font-size:28px;
    letter-spacing:.05em;
    margin:6px 0 22px;
  }
  .call-panel .btn-row{margin-top:4px;}
  button.mute{border-color:var(--dim);}
  button.mute.active{border-color:var(--ring); color:var(--ring);}
  audio{display:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="status-row">
      <span><span class="dot" id="dot"></span><span id="statusText">آفلاین</span></span>
      <span class="num" id="idLabel">— — —</span>
    </div>

    <div class="idle-msg" id="idleMsg">
      دلته انتظار کوم چی څوک زنګ راووهی…
    </div>

    <div class="ring-msg" id="ringMsg">
      <div class="who">🔔 یو څوک غواړي درسره خبرې وکړي</div>
      <div class="btn-row">
        <button class="accept" id="acceptBtn">ومنه</button>
        <button class="decline" id="declineBtn">رد کړه</button>
      </div>
    </div>

    <div class="call-panel" id="callPanel">
      <div class="timer" id="timer">00:00</div>
      <div class="btn-row">
        <button class="mute" id="muteBtn">غږ بند کړه</button>
        <button class="decline" id="hangupBtn">خبرې پای ته ورسوه</button>
      </div>
    </div>
  </div>

  <audio id="ringtone" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>
  <audio id="remoteAudio" autoplay></audio>

<script>
  // ▸▸ دا ID دواړو فایلونو (host.html او index.html) کی یو شان وي
  const HOST_ID = "khaista-call-line-2026";

  const idLabel = document.getElementById('idLabel');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const idleMsg = document.getElementById('idleMsg');
  const ringMsg = document.getElementById('ringMsg');
  const callPanel = document.getElementById('callPanel');
  const ringtone = document.getElementById('ringtone');
  const remoteAudio = document.getElementById('remoteAudio');
  const timerEl = document.getElementById('timer');

  idLabel.textContent = HOST_ID;

  let localStream = null;
  let currentCall = null;
  let timerInterval = null;

  const peer = new Peer(HOST_ID);

  peer.on('open', () => {
    dot.classList.add('live');
    statusText.textContent = 'آنلاین — چمتو یم';
  });

  peer.on('error', (err) => {
    statusText.textContent = 'ستونزه: ' + err.type;
  });

  peer.on('call', (call) => {
    currentCall = call;
    idleMsg.style.display = 'none';
    ringMsg.classList.add('show');
    ringtone.play().catch(()=>{});
  });

  document.getElementById('acceptBtn').onclick = async () => {
    ringtone.pause();
    ringtone.currentTime = 0;
    ringMsg.classList.remove('show');
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      statusText.textContent = 'مايکروفون ونه شو خلاص کړی';
      idleMsg.style.display = 'block';
      return;
    }
    currentCall.answer(localStream);
    currentCall.on('stream', (remoteStream) => {
      remoteAudio.srcObject = remoteStream;
      startCallUI();
    });
    currentCall.on('close', endCallUI);
  };

  document.getElementById('declineBtn').onclick = () => {
    ringtone.pause();
    ringtone.currentTime = 0;
    if (currentCall) currentCall.close();
    ringMsg.classList.remove('show');
    idleMsg.style.display = 'block';
  };

  document.getElementById('hangupBtn').onclick = () => {
    if (currentCall) currentCall.close();
    endCallUI();
  };

  let muted = false;
  document.getElementById('muteBtn').onclick = (e) => {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    e.target.classList.toggle('active', muted);
    e.target.textContent = muted ? 'غږ بېرته پرانیزه' : 'غږ بند کړه';
  };

  function startCallUI() {
    callPanel.classList.add('show');
    let seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      timerEl.textContent = `${m}:${s}`;
    }, 1000);
  }

  function endCallUI() {
    clearInterval(timerInterval);
    timerEl.textContent = '00:00';
    callPanel.classList.remove('show');
    idleMsg.style.display = 'block';
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
  }
</script>
</body>
</html>
