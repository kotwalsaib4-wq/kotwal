<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ژوندي خبرې</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0d1210;
    --panel:#141b18;
    --line:#233029;
    --text:#e8efe9;
    --dim:#7f9188;
    --accent:#4fd1a5;
    --ring:#e6b95c;
    --danger:#e0665a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .box{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px;
    text-align:center;
  }
  h1{
    font-size:16px;
    font-weight:normal;
    color:var(--dim);
    margin:0 0 28px;
    letter-spacing:.02em;
  }
  #numInput{
    display:block;
    width:100%;
    text-align:center;
    font-family:inherit;
    font-size:22px;
    letter-spacing:.1em;
    background:transparent;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--text);
    padding:12px 10px;
    margin-bottom:20px;
    outline:none;
  }
  #numInput:focus{border-color:var(--accent);}
  .phone{
    width:64px;height:64px;
    border-radius:50%;
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
    font-size:26px;
    cursor:pointer;
    background:transparent;
    color:var(--accent);
    transition:background .15s;
  }
  .phone:hover{background:rgba(79,209,165,.12);}
  .phone.dialing{border-color:var(--ring); color:var(--ring); animation:pulse 1.2s infinite;}
  .phone.live{border-color:var(--danger); color:var(--danger);}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.4;}
  }
  .state{
    font-size:14px;
    color:var(--dim);
    min-height:20px;
    margin-bottom:6px;
  }
  .timer{
    font-size:22px;
    letter-spacing:.05em;
    display:none;
  }
  .timer.show{display:block;}
  audio{display:none;}
</style>
</head>
<body>
  <div class="box">
    <h1>د ژوندي خبرو لاین</h1>
    <input type="text" id="numInput" placeholder="نمبر ولیکئ" inputmode="numeric" maxlength="6">
    <button class="phone" id="phoneBtn">☎</button>
    <div class="state" id="stateText">نمبر ولیکئ او د زنګ وهلو لپاره کیکاږئ</div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <audio id="remoteAudio" autoplay></audio>

<script>
  const numInput = document.getElementById('numInput');
  const phoneBtn = document.getElementById('phoneBtn');
  const stateText = document.getElementById('stateText');
  const timerEl = document.getElementById('timer');
  const remoteAudio = document.getElementById('remoteAudio');

  let localStream = null;
  let currentCall = null;
  let timerInterval = null;
  let inCall = false;

  const peer = new Peer();

  peer.on('error', (err) => {
    stateText.textContent = 'ستونزه رامنځته شوه: ' + err.type;
  });

  phoneBtn.onclick = async () => {
    if (inCall) {
      // hang up
      if (currentCall) currentCall.close();
      endCallUI();
      return;
    }
    const num = numInput.value.trim();
    if (!num) {
      stateText.textContent = 'لومړی نمبر ولیکئ';
      return;
    }
    const HOST_ID = "line-" + num;
    numInput.disabled = true;
    startDial();
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      stateText.textContent = 'مايکروفون ونه شو خلاص کړی';
      resetUI();
      return;
    }
    currentCall = peer.call(HOST_ID, localStream);
    currentCall.on('stream', (remoteStream) => {
      remoteAudio.srcObject = remoteStream;
      startCallUI();
    });
    currentCall.on('close', endCallUI);
    currentCall.on('error', () => {
      stateText.textContent = 'زنګ ونه شو ورکړی';
      resetUI();
    });
  };

  function startDial(){
    phoneBtn.classList.add('dialing');
    stateText.textContent = 'زنګ وهل کیږي… ډډه صبر وکړئ';
  }

  function startCallUI(){
    inCall = true;
    phoneBtn.classList.remove('dialing');
    phoneBtn.classList.add('live');
    phoneBtn.textContent = '⏹';
    stateText.textContent = 'خبرې روانې دي — د پای لپاره کیکاږئ';
    timerEl.classList.add('show');
    let seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      timerEl.textContent = `${m}:${s}`;
    }, 1000);
  }

  function endCallUI(){
    resetUI();
    stateText.textContent = 'خبرې پای ته ورسیدې';
  }

  function resetUI(){
    inCall = false;
    numInput.disabled = false;
    clearInterval(timerInterval);
    timerEl.classList.remove('show');
    timerEl.textContent = '00:00';
    phoneBtn.classList.remove('dialing','live');
    phoneBtn.textContent = '☎';
    if (!stateText.textContent.includes('ونه شو')) {
      stateText.textContent = 'د زنګ وهلو لپاره کیکاږئ';
    }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
  }
</script>
</body>
</html>
